<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fractal flames</title>
    <link rel="stylesheet" href="style.css">
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
      integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
      crossorigin="anonymous"
      ></script>
  </head>

  <body>
    <h1>Fractal Flames</h1>
    <hr>
    <div class="main-content-container"> 
        <canvas id="glcanvas"></canvas>
        <div id="controls">
          <h3>Select Variations</h3>
            <div id="variation-checkboxes"></div>
            <button id="regenerate-btn">Regenerate</button>
            <div class="control-group">
              <input type="checkbox" id="pause-animation">
              <label for="pause-animation">Pause Animation</label>
            </div>
        </div>
    </div>
    <script src="webgl.js" type="module"></script>
  </body>
</html>
